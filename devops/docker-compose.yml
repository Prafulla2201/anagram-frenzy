version: '3'
services:
  app:
    build: .
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
    ports:
      - "5000:5000"
    depends_on:
      - db
    healthcheck:
      test: ["curl -f http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - .:/app
      - ./seed_data.db:/app/db.sqlite
    restart: always

  db:
    image: postgres:12
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./seed_data.db:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always